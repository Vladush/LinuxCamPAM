name: Lint & Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck pandoc
          sudo npm install -g markdownlint-cli

      - name: Run Cppcheck (Static Analysis)
        # Enable all checks except detailed information. Suppress missingInclude checks for system includes.
        run: cppcheck --enable=warning,performance,portability,style --error-exitcode=1 --force --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=knownConditionTrueFalse --suppress="*:include/json.hpp" -DPAM_IT_DIR=\"/tmp\" -DLINUXCAMPAM_TEST_PAM_DIR=\"/tmp\" -DLINUXCAMPAM_TEST_SOCKET_PATH=\"/tmp/sock\" -DLINUXCAMPAM_VERSION=\"1.0\" -I include src tests

      - name: Run Markdown Lint
        # Check all markdown files in root and docs/
        run: markdownlint "**/*.md" --ignore "node_modules"
