name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dockerignore"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dockerignore"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "docs/**"

jobs:
  download-models:
    name: Download Models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download models
        run: ./scripts/download_models.sh

      - name: Verify models exist
        run: |
          test -s models/face_detection_yunet_2023mar.onnx
          test -s models/face_recognition_sface_2021dec.onnx

      - name: Upload models artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-models
          path: models/*.onnx
          retention-days: 1

  build-gcc:
    name: Build (GCC)
    needs: download-models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake libopencv-dev libpam0g-dev \
            libjsoncpp-dev nlohmann-json3-dev v4l-utils \
            libgtest-dev devscripts debhelper dh-cmake pandoc

      - name: Cache OpenCV Static
        id: cache-opencv
        uses: actions/cache@v5
        with:
          path: opencv_static
          key: ${{ runner.os }}-${{ runner.arch }}-opencv-4.12.0-static-rev1

      - name: Build OpenCV Static
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_opencv.sh
          ./scripts/build_opencv.sh

      - name: Retrieve models
        uses: actions/download-artifact@v8
        with:
          name: ai-models
          path: models

      - name: Install models to system
        run: |
          sudo mkdir -p /usr/share/linuxcampam/models
          sudo cp models/*.onnx /usr/share/linuxcampam/models/

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build package
        run: |
          dpkg-buildpackage -b -uc -us
          mv ../linuxcampam_*.deb .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linuxcampam-amd64-deb
          path: linuxcampam_*.deb
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  build-clang:
    name: Build (Clang)
    needs: download-models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake libopencv-dev libpam0g-dev \
            libjsoncpp-dev nlohmann-json3-dev v4l-utils \
            libgtest-dev devscripts debhelper dh-cmake pandoc

      - name: Cache OpenCV Static
        id: cache-opencv
        uses: actions/cache@v5
        with:
          path: opencv_static
          key: ${{ runner.os }}-${{ runner.arch }}-opencv-4.12.0-static-clang-rev1

      - name: Build OpenCV Static
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        env:
          CC: clang
          CXX: clang++
        run: |
          chmod +x scripts/build_opencv.sh
          ./scripts/build_opencv.sh

      - name: Retrieve models
        uses: actions/download-artifact@v8
        with:
          name: ai-models
          path: models

      - name: Install models to system
        run: |
          sudo mkdir -p /usr/share/linuxcampam/models
          sudo cp models/*.onnx /usr/share/linuxcampam/models/

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        env:
          CC: clang
          CXX: clang++
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-aarch64:
    name: Build (aarch64)
    needs: download-models
    runs-on: ubuntu-24.04-arm # Native ARM runner - faster than QEMU
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake libopencv-dev libpam0g-dev \
            libjsoncpp-dev nlohmann-json3-dev v4l-utils \
            libgtest-dev devscripts debhelper dh-cmake pandoc

      - name: Cache OpenCV Static
        id: cache-opencv
        uses: actions/cache@v5
        with:
          path: opencv_static
          key: ${{ runner.os }}-${{ runner.arch }}-opencv-4.12.0-static-rev1

      - name: Build OpenCV Static
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_opencv.sh
          ./scripts/build_opencv.sh

      - name: Retrieve models
        uses: actions/download-artifact@v8
        with:
          name: ai-models
          path: models

      - name: Install models to system
        run: |
          sudo mkdir -p /usr/share/linuxcampam/models
          sudo cp models/*.onnx /usr/share/linuxcampam/models/

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build package
        run: |
          dpkg-buildpackage -b -uc -us
          mv ../linuxcampam_*.deb .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linuxcampam-aarch64-deb
          path: linuxcampam_*.deb
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  build-i386:
    name: Build (i386)
    needs: download-models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/386
          cache-image: false
        continue-on-error: true

      - name: Set up QEMU (Retry)
        if: failure()
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/386
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        continue-on-error: true

      - name: Set up Docker Buildx (Retry)
        if: failure()
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve models
        uses: actions/download-artifact@v8
        with:
          name: ai-models
          path: models

      - name: Cache OpenCV Static
        id: cache-opencv
        uses: actions/cache@v5
        with:
          path: opencv_static_cached
          key: ${{ runner.os }}-i386-opencv-4.12.0-static-rev1

      - name: Build i386
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.i386
          platforms: linux/386
          load: true
          tags: linuxcampam:i386
          cache-from: type=registry,ref=ghcr.io/vladush/linuxcampam-cache:i386
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/vladush/linuxcampam-cache:i386,mode=max' || '' }}

      - name: Extract artifacts
        run: |
          docker create --name temp_container linuxcampam:i386
          docker cp temp_container:/artifacts/. .
          rm -rf ./opencv_static_cached
          mv ./opencv_static ./opencv_static_cached || true
          docker rm temp_container
          echo "Extracted files:"
          ls -la linuxcampam_*.deb || { echo "ERROR: No .deb files found!"; exit 1; }

      - name: Verify
        run: docker run --rm --platform linux/386 --entrypoint /usr/bin/linuxcampam linuxcampam:i386 help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linuxcampam-i386-deb
          path: linuxcampam_*.deb
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  build-riscv64:
    name: Build (riscv64)
    needs: download-models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/riscv64
          cache-image: false
        continue-on-error: true

      - name: Set up QEMU (Retry)
        if: failure()
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/riscv64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        continue-on-error: true

      - name: Set up Docker Buildx (Retry)
        if: failure()
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve models
        uses: actions/download-artifact@v8
        with:
          name: ai-models
          path: models

      - name: Cache OpenCV Static
        id: cache-opencv
        uses: actions/cache@v5
        with:
          path: opencv_static_cached
          key: ${{ runner.os }}-riscv64-opencv-4.12.0-static-rev1

      - name: Build riscv64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.riscv64
          platforms: linux/riscv64
          load: true
          tags: linuxcampam:riscv64
          cache-from: type=registry,ref=ghcr.io/vladush/linuxcampam-cache:riscv64
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/vladush/linuxcampam-cache:riscv64,mode=max' || '' }}

      - name: Extract artifacts
        run: |
          docker create --name temp_container linuxcampam:riscv64
          docker cp temp_container:/artifacts/. .
          rm -rf ./opencv_static_cached
          mv ./opencv_static ./opencv_static_cached || true
          docker rm temp_container
          echo "Extracted files:"
          ls -la linuxcampam_*.deb || { echo "ERROR: No .deb files found!"; exit 1; }

      - name: Verify
        run: docker run --rm --platform linux/riscv64 --entrypoint /usr/bin/linuxcampam linuxcampam:riscv64 help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linuxcampam-riscv64-deb
          path: linuxcampam_*.deb
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
