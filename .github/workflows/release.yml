name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    # Only release from tag pushes in this repository. For fork pull requests,
    # head_branch is attacker-chosen and the artifacts are attacker-built.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'v') }}
    permissions:
      contents: write
    steps:
      - name: Verify tag matches the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)
          if [ "$tag_sha" != "$HEAD_SHA" ]; then
            echo "::error::Tag ${TAG} (${tag_sha}) does not match CI commit ${HEAD_SHA}"
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: linuxcampam-*-deb
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: linuxcampam_*.deb
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
